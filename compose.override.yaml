
services:
  web:
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor

  database:
    ports:
      # Port fixe pour que Laravel (lancé hors Docker) puisse se connecter sur 127.0.0.1:3306
      - "3306:3306"

  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
